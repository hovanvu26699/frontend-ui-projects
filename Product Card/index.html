<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product card</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="card">
      <div class="card__act">
        <div class="card__heart">
          <i class="bx bx-heart"></i>
        </div>
        <div class="card__cart">
          <i class="bx bx-cart"></i>
        </div>
      </div>
      <div class="card__img">
        <img src="./IMG_Shoes.png" alt="image" />
      </div>
      <div class="card__title">Nike Zoom KD 12</div>
      <div class="card__price">$99</div>
      <div class="card__opt">
        <div class="card__size">
          <h3>Size:</h3>
          <span>6</span>
          <span>7</span>
          <span>8</span>
          <span>9</span>
        </div>
        <div class="card__color">
          <h3>Color:</h3>
          <div class="card__color-green"></div>
          <div class="card__color-red"></div>
          <div class="card__color-black"></div>
        </div>
        <div class="card__btn">
          <button>Buy Now</button>
          <button>Add Cart</button>
        </div>
      </div>
    </div>
  </body>
</html>
